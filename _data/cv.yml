# Source of truth for /cv/. Rendered by al_folio_cv (see _pages/cv.md).
#
# `label`, `image` and `summary` are read by the al-folio CV page but rejected by
# RenderCV >= 2.x, which is why .github/workflows/render-cv.yml no longer runs on
# pushes to this file. The PDFs linked from the page are hand-made, not generated.
cv:
  name: Tadeo M. Klappenbach
  label: MSc. Computer Science student at Columbia University
  location: New York, NY
  image: ""
  # Deliberately no email or phone: the about page keeps the address off the
  # page for scrapers, and the PDFs below carry the real contact details.
  address:
    city: New York
    region: NY
  summary: >-
    MSc. in Computer Science student at Columbia University.
    Prev: Quantitative Researcher at Duquesne Capital Management, Founding Team @ Move37AI.

  social_networks:
    - network: LinkedIn
      username: tadeo-maría-klappenbach

  sections:
    Experience:
      - company: Duquesne Capital Management
        position: Quantitative Researcher
        location: New York City, New York
        start_date: 2023-09
        end_date: 2026-03
        highlights:
          - Research and development for the systematic macro trading team, integrating alternative and proprietary datasets and statistical learning techniques, at Stanley Druckenmiller's fund.

      - company: Move37AI
        position: Argentina Branch Lead
        location: Buenos Aires, Argentina
        start_date: 2022-07
        end_date: 2023-09
        highlights:
          - In charge of a team of fifteen working from the Buenos Aires office for one year and a half before being transferred to the US, directing our research and technical strategies.

      - company: Move37AI
        position: Founding Machine Learning Engineer
        location: Buenos Aires, Argentina
        start_date: 2020-12
        end_date: 2022-07
        highlights:
          - Quant-focused hedge fund spinoff centered on non-conventional financial markets.
          - Move37AI's first employee.
          - We develop machine learning models to participate in niche financial markets, with a special focus in horse betting and auctions.
          - We use large amounts of self-obtained high-quality data and cutting edge quantitative techniques to find systematic strategies that can produce sustained excess returns.
          - As a team of three we built a fully systematic data-based project from scratch, now operating over 5mm USD a year in Sports Betting across 30 different venues in multiple countries, becoming the largest gambling operation in Latin-America.
          - Responsible for developing and improving the precision of our predictive models, designing our pricing and betting strategies and building both the ETL routines and low-latency live-betting infrastructure.

    Education:
      # `degree` carries the whole "MSc, Computer Science" line, the way the PDF
      # sets it. Splitting it across `degree` + `area` renders as two stacked
      # lines under the institution instead of one.
      - institution: Columbia University
        location: New York, NY
        degree: MSc, Computer Science
        start_date: 2026
        end_date: 2028
        highlights:
          - "Track: Machine Learning."
          - "GPA: 4.00/4.00."

      - institution: Universidad Torcuato Di Tella
        location: Buenos Aires, Argentina
        degree: BSc, Economics
        start_date: 2017
        end_date: 2020
        highlights:
          - Valedictorian.
          - "GPA: 9.81/10."
          - "Thesis: *Socially Optimal Spending in Tax Collection*."

      - institution: Università Bocconi
        location: Milan, Italy
        degree: Exchange Student
        date: 2019
        highlights:
          - One semester exchange program.
          - "GPA: 29/30."

    # Sections below have no dedicated renderer in al_folio_cv, so they use the
    # generic branch, which only prints `bullet` (markdown) or `label`/`details`.
    Awards and Achievements:
      - bullet: "**Valedictorian, Universidad Torcuato Di Tella class of 2021** — Summa Cum Laude (Gold Medal for highest GPA, rank #1). *2021*"
      - bullet: "**Argentine National Academy of Economic Sciences Excellence Award.** *2021*"
      - bullet: "**Best Economics Department thesis of 2021.** *2021*"
      - bullet: "**Santander Bank Fellowship.** *2021*"
      - bullet: "**Summa Cum Laude, Computational Microeconomics** — Università Bocconi. *2019*"

    Talks and Presentations:
      - bullet: "**Dynamic portfolio allocation: Learning from the best** — Universidad Torcuato Di Tella, II Workshop in Machine Learning. *Dec 2023*"

    Service:
      - bullet: "**Xavier Mission, Welcome Table** — *Volunteer, 2023-2025.* I participate in the weekly community meals program, welcoming and serving guests, helping provide food to individuals facing homelessness and food insecurity."
      - bullet: "**Noche de Caridad** — *Volunteer, 2016-2023.* Weekly street walks providing meals and support to individuals experiencing homelessness."
      - bullet: "**Navidad para Todos** — *Volunteer, 2016-2020.* Participated in organizing and distributing gift and food boxes to vulnerable groups spending Christmas Eve in solitude, like homeless individuals, hospitalized children and hospital staff."
      - bullet: "**San Ignacio** — *Group Leader, 2015-2018.* Coordination and organization of a social work group traveling to Maciá, a small town with high poverty rates in the province of Entre Ríos, Argentina. In charge of 150 teenagers (15-18 years old), traveling twice a year, and responsible for logistics (transportation and lodging), activity schemes and fundraising. Treatment of various local challenges, mainly focused in providing support to vulnerable groups."
      - bullet: "**Techo** — *Volunteer, 2013-2015.* Housing construction program for families living in extreme poverty."

    # Kept last so it renders at the foot of the page; the CV also has a PDF icon
    # in the page title, wired through `cv_pdf` in _pages/cv.md.
    Downloads:
      - bullet: "[**Curriculum vitae** (PDF)](/assets/pdf/Tadeo_Klappenbach_CV.pdf) — the long version."
      - bullet: "[**Résumé** (PDF)](/assets/pdf/Tadeo_Klappenbach_Resume.pdf) — one page, squeezed into the shape recruiting pipelines want."
